events {
    worker_connections 1024;
}

http {
    upstream trendorabay_backend {
        least_conn;
        keepalive 32;

        # Sticky sessions only needed for server-side state.
        # JWT auth is stateless, so they are disabled by default.
        # ip_hash;
        # sticky cookie srv_id expires=1h domain=.trendorabay.com path=/;

        server 127.0.0.1:3001 weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3002 weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3003 weight=5 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 50M;

        location / {
            proxy_pass http://trendorabay_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://trendorabay_backend/api/health;
            access_log off;
        }
    }
}
