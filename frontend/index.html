<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="scroll-position" content="top" />

    <title>Trendorabay | Digital Magazine, Stories, Podcasts & Culture</title>

    <meta
      name="description"
      content="Trendorabay is a digital media platform featuring stories, magazines, podcasts, music, fashion, gaming, travel, photography, parenting, youth policy, automotive and culture."
    />

    <meta
      name="keywords"
      content="Trendorabay, magazine, stories, podcasts, music, fashion, gaming, travel, photography, culture"
    />

    <meta name="author" content="Trendorabay" />

    <!-- DNS prefetch and preconnect for faster connections -->
    <link rel="dns-prefetch" href="https://trendorabay-platform.onrender.com">
    <link rel="preconnect" href="https://trendorabay-platform.onrender.com">
    <link rel="dns-prefetch" href="https://trendorabay-content-management-system.onrender.com">
    <link rel="preconnect" href="https://trendorabay-content-management-system.onrender.com">
  </head>

  <body>
    <style>
      /* Prevent footer flash on page load */
      body {
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      
      /* Hide content initially to prevent flash */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      
      /* Show content after scroll is set */
      body.loaded #root {
        opacity: 1;
      }
    </style>
    <div id="root"></div>
    <script>
      // Optimized scroll restoration with smooth scrolling
      (function() {
        // Disable scroll restoration to control it manually
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        // Clear hash to prevent auto-scrolling
        if (window.location.hash) {
          history.replaceState(null, null, ' ');
        }

        // Enable smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
        document.body.style.scrollBehavior = 'smooth';

        // Smooth scroll to top
        const smoothScrollToTop = () => {
          const scrollTo = 0;
          const duration = 500; // 500ms smooth scroll
          const start = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop;
          const startTime = performance.now();

          const animateScroll = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Ease out cubic function for smooth deceleration
            const easeOut = 1 - Math.pow(1 - progress, 3);
            
            const currentPosition = start - (start * easeOut);
            
            window.scrollTo(0, currentPosition);
            document.documentElement.scrollTop = currentPosition;
            document.body.scrollTop = currentPosition;

            if (progress < 1) {
              requestAnimationFrame(animateScroll);
            } else {
              // Mark as loaded after scroll completes
              document.body.classList.add('loaded');
            }
          };

          requestAnimationFrame(animateScroll);
        };

        // Start smooth scroll
        smoothScrollToTop();
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
