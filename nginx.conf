events {
    worker_connections 1024;
}

http {
    upstream trendorabay_backend {
        least_conn;
        keepalive 32;

        # Sticky sessions are only needed for server-side state (e.g. sessions).
        # This app uses stateless JWT auth, so they are disabled by default.
        # Uncomment one of the following if you switch to session-based auth:
        # ip_hash;
        # sticky cookie srv_id expires=1h domain=.trendorabay.com path=/;

        server app1:3001 weight=5 max_fails=3 fail_timeout=30s;
        server app2:3001 weight=5 max_fails=3 fail_timeout=30s;
        server app3:3001 weight=5 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        location / {
            proxy_pass http://trendorabay_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://trendorabay_backend/api/health;
            access_log off;
        }
    }
}
